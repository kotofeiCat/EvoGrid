server:
  port: 8888

spring:
  application:
    name: config-server
  # native — настройки лежат в classpath:/config (папка config рядом с этим файлом):
  #   config/application.yml   — общие для всех сервисов
  #   config/<имя-сервиса>.yml — только для одного сервиса
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

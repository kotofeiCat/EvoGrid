# Настройки только для world-service
world:
  spawns:
    # в каком радиусе от игрока показываем эвонов
    search-radius-meters: 130
    # в каком радиусе создаём новых
    spawn-radius-meters: 70
    # сколько эвонов должно быть рядом
    min-nearby: 6
    # через сколько спавн исчезает
    lifetime: 15m
    # на сколько эвон бронируется под начатый бой
    reservation: 5m

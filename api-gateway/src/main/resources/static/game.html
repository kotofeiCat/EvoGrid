<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1f5eff">
    <title>EvoGrid — Карта мира</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/uiverse.css">
</head>
<body>

<div class="fullscreen-map-wrap">
    <div id="map"></div>

    <div id="map-loader" class="map-loader" role="status">
        <div class="loader"></div>
        <span class="map-loader-text">Загружаем карту</span>
    </div>
</div>

<!-- Кнопка «Где я» -->
<button type="button" class="map-fab" onclick="centerOnTrainerGps()" title="Показать, где я" aria-label="Показать, где я">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<!-- Нижний док -->
<div id="dock-mount"></div>

<!-- Модальное окно осмотра дикого эвона -->
<div id="modal-wild-inspect" class="modal-backdrop hidden">
    <div class="modal-window">
        <div class="inspector-layout">
            <div id="wild-card-holder"></div>
            <div class="inspector-details">
                <h2 id="wild-title">Дикий эвон</h2>
                <div id="wild-lore" class="lore-box"></div>
                <p class="active-slot-hint">
                    В бой вступит: <b id="wild-active-slot-label">Слот #1</b>
                </p>
                <div class="modal-actions-row">
                    <button class="uiv-btn primary" onclick="confirmStartBattle()">
                        <span class="button_top">Вступить в бой</span>
                    </button>
                    <button class="uiv-btn" onclick="closeWildModal()">
                        <span class="button_top">Отмена</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно боя -->
<div id="modal-battle" class="modal-backdrop hidden">
    <div class="modal-window battle-modal-window">
        <div class="battle-header">
            <h3 id="battle-status-title">Ход 1</h3>
            <div id="turn-timer" class="turn-timer" aria-live="polite">
                <span class="turn-timer-label"><span id="turn-timer-sec">30</span> с</span>
                <div class="turn-timer-track"><div id="turn-timer-fill" class="turn-timer-fill"></div></div>
            </div>
        </div>
        <p class="battle-rules-hint">Огонь бьёт лес, лес — воду, вода — огонь (x1.5). Атака своей стихии — x1.25.</p>

        <div class="battle-arena-row">
            <div class="battle-fighter-col">
                <div id="battle-player-card"></div>
                <div class="hp-bar"><div id="battle-player-hp" class="hp-bar-fill"></div></div>
                <div id="battle-player-statuses" class="status-badges-row"></div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="battle-fighter-col">
                <div id="battle-enemy-card"></div>
                <div class="hp-bar"><div id="battle-enemy-hp" class="hp-bar-fill"></div></div>
                <div id="battle-enemy-statuses" class="status-badges-row"></div>
            </div>
        </div>

        <!-- Отряд: кто на поле, кто в запасе. Тап по бойцу в запасе — смена (тратит ход) -->
        <div class="team-strip-wrap">
            <div class="abilities-section-title">Отряд <span class="team-strip-hint">нажмите на бойца, чтобы сменить — это тратит ход</span></div>
            <div id="battle-team" class="team-strip"></div>
        </div>

        <div id="battle-result" class="battle-result hidden"></div>

        <div id="battle-log-container" class="combat-log-box"></div>

        <div id="battle-skip-notice" class="skip-notice hidden">
            <span id="battle-skip-text">Ваш эвон спит и не может атаковать.</span>
            <button class="uiv-btn primary" onclick="skipTurn()">
                <span class="button_top">Пропустить ход</span>
            </button>
        </div>

        <div id="battle-abilities-wrap">
            <div class="abilities-section-title">Способность на этот ход</div>
            <div id="battle-abilities-grid" class="abilities-grid"></div>
        </div>

        <!-- Сумка в бою: выбор сферы или лечилки -->
        <div id="battle-bag-panel" class="bag-panel hidden">
            <div class="bag-panel-head">
                <span id="battle-bag-title" class="abilities-section-title">Сумка</span>
                <button type="button" class="bag-panel-close" onclick="closeBattleBag()" aria-label="Закрыть сумку">✕</button>
            </div>
            <div id="battle-bag-hint" class="bag-panel-hint"></div>
            <div id="battle-bag-list" class="bag-list"></div>
        </div>

        <div class="modal-actions-row battle-actions-row">
            <button id="btn-open-spheres" class="uiv-btn primary" onclick="openBattleBag('CAPTURE')">
                <span class="button_top">Поймать</span>
            </button>
            <button id="btn-open-items" class="uiv-btn" onclick="openBattleBag('HEAL')">
                <span class="button_top">Предмет</span>
            </button>
            <button class="uiv-btn" onclick="closeBattleWindow()">
                <span class="button_top">Выйти</span>
            </button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/pokemon-art.js"></script>
<script src="js/item-art.js"></script>
<script src="js/gestures.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/game.js"></script>
</body>
</html>

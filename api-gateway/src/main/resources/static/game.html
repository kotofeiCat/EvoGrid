<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EvoGrid — Карта мира</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/uiverse.css">
</head>
<body>
<div class="fullscreen-map-wrap">
    <div id="map"></div>
</div>

<!-- Белая нижняя навигация -->
<div id="dock-mount"></div>

<!-- Модальное окно осмотра дикого покемона -->
<div id="modal-wild-inspect" class="modal-backdrop hidden">
    <div class="modal-window">
        <div class="inspector-layout">
            <div id="wild-card-holder"></div>
            <div class="inspector-details">
                <h2 id="wild-title">Дикий покемон</h2>
                <div id="wild-lore" class="lore-box"></div>
                <p class="active-slot-hint">
                    Ваш активный боец: <b id="wild-active-slot-label">Слот #1</b>
                </p>
                <div class="modal-actions-row">
                    <button class="uiv-btn primary" style="flex:1" onclick="confirmStartBattle()">
                        <span class="button_top">В бой</span>
                    </button>
                    <button class="uiv-btn" onclick="closeWildModal()">
                        <span class="button_top">Закрыть</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно боя -->
<div id="modal-battle" class="modal-backdrop hidden">
    <div class="modal-window battle-modal-window">
        <div class="battle-header">
            <h3 id="battle-status-title">Ход 1</h3>
            <span class="battle-rules-hint">FIRE &gt; FOREST &gt; WATER (x1.5)</span>
        </div>
        <div class="battle-arena-row">
            <div id="battle-player-card"></div>
            <div class="vs-badge">VS</div>
            <div id="battle-enemy-card"></div>
        </div>
        <div id="battle-log-container" class="combat-log-box"></div>
        <div class="modal-actions-row">
            <button id="btn-do-attack" class="uiv-btn primary" style="flex:1" onclick="doAttack()">
                <span class="button_top">Атаковать</span>
            </button>
            <button id="btn-do-catch" class="uiv-btn" style="flex:1" onclick="doCatch()">
                <span class="button_top">Поймать</span>
            </button>
            <button class="uiv-btn" onclick="closeBattleWindow()">
                <span class="button_top">Выйти</span>
            </button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#13231b">
    <title>EvoGrid — Карта мира</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/uiverse.css">
</head>
<body>

<div class="fullscreen-map-wrap">
    <!-- Плавающая панель управления геопозицией -->
    <div class="floating-map-controls">
        <span id="active-fighter-indicator" class="fighter-pill-text">Слот #1 • Радар 70 м</span>
        <label class="walk-toggle-label" title="Позволяет перемещаться кликом по Яндекс Карте">
            <input type="checkbox" id="click-walk-toggle" checked>
            <span>Ходьба<span class="walk-text-long"> кликом</span></span>
        </label>
        <button type="button" class="recenter-gps-btn" onclick="centerOnTrainerGps()" title="Центрировать на моей геопозиции" aria-label="Центрировать на моей геопозиции">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            <span class="btn-text">Где я</span>
        </button>
    </div>

    <div id="map"></div>
</div>

<!-- Нижний док -->
<div id="dock-mount"></div>

<!-- Модальное окно осмотра дикого покемона -->
<div id="modal-wild-inspect" class="modal-backdrop hidden">
    <div class="modal-window">
        <div class="inspector-layout">
            <div id="wild-card-holder"></div>
            <div class="inspector-details">
                <h2 id="wild-title">Дикий покемон</h2>
                <div id="wild-lore" class="lore-box"></div>
                <p class="active-slot-hint">
                    В бой вступит: <b id="wild-active-slot-label">Слот #1</b>
                </p>
                <div class="modal-actions-row">
                    <button class="uiv-btn primary" onclick="confirmStartBattle()">
                        <span class="button_top">Вступить в бой</span>
                    </button>
                    <button class="uiv-btn" onclick="closeWildModal()">
                        <span class="button_top">Отмена</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно боя -->
<div id="modal-battle" class="modal-backdrop hidden">
    <div class="modal-window battle-modal-window">
        <div class="battle-header">
            <h3 id="battle-status-title">Ход 1</h3>
            <span class="battle-rules-hint">FIRE &gt; FOREST &gt; WATER (x1.5) • STAB x1.25</span>
        </div>

        <div class="battle-arena-row">
            <div class="battle-fighter-col">
                <div id="battle-player-card"></div>
                <div id="battle-player-statuses" class="status-badges-row"></div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="battle-fighter-col">
                <div id="battle-enemy-card"></div>
                <div id="battle-enemy-statuses" class="status-badges-row"></div>
            </div>
        </div>

        <div id="battle-log-container" class="combat-log-box"></div>

        <!-- Сетка из 4 способностей -->
        <div class="abilities-section-title">Способность на этот ход</div>
        <div id="battle-abilities-grid" class="abilities-grid"></div>

        <!-- Нижний ряд действий -->
        <div class="modal-actions-row">
            <button id="btn-do-catch" class="uiv-btn primary" onclick="doCatch()">
                <span class="button_top">Бросить Покебол</span>
            </button>
            <button class="uiv-btn" onclick="closeBattleWindow()">
                <span class="button_top">Выйти</span>
            </button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/game.js"></script>
</body>
</html>

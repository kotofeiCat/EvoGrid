<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f5eff">
    <title>EvoGrid — Магазин</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/uiverse.css">
</head>
<body>

<main class="workspace-page">
    <section class="view-section">
        <div class="shop-head">
            <div class="section-header left-align">
                <h2>Магазин</h2>
                <p>Сферы для поимки, настои для лечения и «Искра жизни» для бойцов без сил. Монеты дают за каждый бой.</p>
            </div>
            <div class="coins-badge" aria-live="polite">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.6-.9-1.6-1.5-2.8-1.5-1.7 0-2.9 1-2.9 2.2 0 2.9 6 1.6 6 4.6 0 1.3-1.3 2.2-3.1 2.2-1.3 0-2.4-.6-3-1.5"/><path d="M12 6v12"/></svg>
                <span id="shop-coins">—</span>
            </div>
        </div>

        <div class="shop-tabs" role="tablist">
            <button type="button" class="shop-tab active" data-kind="CAPTURE" role="tab">Сферы</button>
            <button type="button" class="shop-tab" data-kind="CARE" role="tab">Лечение</button>
        </div>

        <div id="shop-list" class="shop-grid">
            <div class="empty-hint">Загружаем витрину…</div>
        </div>
    </section>
</main>

<div id="dock-mount"></div>

<script src="js/api.js"></script>
<script src="js/gestures.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/item-art.js"></script>
<script src="js/shop.js"></script>
</body>
</html>

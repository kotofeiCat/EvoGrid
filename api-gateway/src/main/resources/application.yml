server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

yandex:
  maps:
    api-key: ${YANDEX_MAPS_API_KEY:}

spring:
  application:
    name: api-gateway
  config:
    import: "configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
        - id: pokemon-service
          uri: lb://pokemon-service
          predicates:
            - Path=/api/pokemons/**
          filters:
            - name: CircuitBreaker
              args:
                name: pokemonServiceCB
                fallbackUri: forward:/fallback/pokemon-service
        - id: world-service
          uri: lb://world-service
          predicates:
            - Path=/api/world/**
          filters:
            - name: CircuitBreaker
              args:
                name: worldServiceCB
                fallbackUri: forward:/fallback/world-service
        - id: battle-service
          uri: lb://battle-service
          predicates:
            - Path=/api/battles/**
          filters:
            - name: CircuitBreaker
              args:
                name: battleServiceCB
                fallbackUri: forward:/fallback/battle-service
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/shop/**,/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceCB
                fallbackUri: forward:/fallback/inventory-service

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs
        - id: pokemon-service-docs
          uri: lb://pokemon-service
          predicates:
            - Path=/api-docs/pokemon-service
          filters:
            - SetPath=/v3/api-docs
        - id: world-service-docs
          uri: lb://world-service
          predicates:
            - Path=/api-docs/world-service
          filters:
            - SetPath=/v3/api-docs
        - id: battle-service-docs
          uri: lb://battle-service
          predicates:
            - Path=/api-docs/battle-service
          filters:
            - SetPath=/v3/api-docs
        - id: inventory-service-docs
          uri: lb://inventory-service
          predicates:
            - Path=/api-docs/inventory-service
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /api-docs/user-service
      - name: pokemon-service
        url: /api-docs/pokemon-service
      - name: world-service
        url: /api-docs/world-service
      - name: battle-service
        url: /api-docs/battle-service
      - name: inventory-service
        url: /api-docs/inventory-service

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s

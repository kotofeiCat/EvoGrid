x-spring-service: &spring-service
  build:
    context: .
  restart: always
  networks:
    - evogrid-net

x-cloud-env: &cloud-env
  CONFIG_SERVER_HOST: config-server
  EUREKA_URI: http://discovery-server:8761/eureka

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

x-after-infra: &after-infra
  postgres:
    condition: service_healthy
  discovery-server:
    condition: service_healthy
  config-server:
    condition: service_healthy

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

networks:
  evogrid-net:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: evogrid-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - evogrid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    container_name: evogrid-db-init
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-postgres}
    volumes:
      - ./init-scripts:/init:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init/01-init.sql"]
    networks:
      - evogrid-net
    depends_on:
      postgres:
        condition: service_healthy

  discovery-server:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: discovery-server/target/discovery-server-1.0.0.jar
    container_name: discovery-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      <<: *healthcheck

  config-server:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: config-server/target/config-server-1.0.0.jar
    container_name: config-server
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      <<: *healthcheck

  user-service:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: user-service/target/user-service-1.0.0.jar
    container_name: user-service
    environment:
      <<: [*cloud-env, *db-env]
      DB_NAME: ${USER_DB_NAME:-user_db}
      JWT_SECRET: ${JWT_SECRET:-EvoGridSuperSecretKeyForJwtSigning2026CloudMvpProject!}
    depends_on: *after-infra
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      <<: *healthcheck

  pokemon-service:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: pokemon-service/target/pokemon-service-1.0.0.jar
    container_name: pokemon-service
    environment:
      <<: [*cloud-env, *db-env]
      DB_NAME: ${POKEMON_DB_NAME:-pokemon_db}
    depends_on: *after-infra
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      <<: *healthcheck

  world-service:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: world-service/target/world-service-1.0.0.jar
    container_name: world-service
    environment:
      <<: [*cloud-env, *db-env]
      DB_NAME: ${WORLD_DB_NAME:-world_db}
    depends_on: *after-infra
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      <<: *healthcheck

  battle-service:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: battle-service/target/battle-service-1.0.0.jar
    container_name: battle-service
    environment:
      <<: [*cloud-env, *db-env]
      DB_NAME: ${BATTLE_DB_NAME:-battle_db}
    depends_on: *after-infra
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      <<: *healthcheck

  inventory-service:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: inventory-service/target/inventory-service-1.0.0.jar
    container_name: inventory-service
    environment:
      <<: [*cloud-env, *db-env]
      DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
    depends_on:
      <<: *after-infra
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      <<: *healthcheck

  api-gateway:
    <<: *spring-service
    build:
      context: .
      args:
        JAR_FILE: api-gateway/target/api-gateway-1.0.0.jar
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *cloud-env
      JWT_SECRET: ${JWT_SECRET:-EvoGridSuperSecretKeyForJwtSigning2026CloudMvpProject!}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      <<: *healthcheck

server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"

jwt:
  secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    configs:
      default:
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - org.springframework.web.server.ResponseStatusException

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:EvoGridSuperSecretKeyForJwtSigning2026CloudMvpProject!}

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

resilience4j:
  circuitbreaker:
    instances:
      pokemonStarter:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s